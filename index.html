<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GreenSite | خريطة أولويات التشجير</title>
<meta name="description" content="GreenSite: خريطة تفاعلية لأولويات التشجير بالعراق، مبنية على بيانات أقمار صناعية حقيقية. بغداد متاحة الآن.">
<meta property="og:title" content="GreenSite | خريطة أولويات التشجير">
<meta property="og:description" content="اختار محافظتك وشوف وين التشجير أولى. بغداد متاحة الآن، وباقي المحافظات قريباً.">
<meta name="theme-color" content="#0A120D">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/vendor/fonts/readex-pro-arabic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/vendor/maplibre/maplibre-gl.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="is-intro">

<div id="map" aria-label="خريطة العراق"></div>
<div class="vignette" aria-hidden="true"></div>

<aside class="panel" id="panel" aria-label="لوحة التحكم">
  <button class="grip" id="grip" type="button" aria-label="كبّر أو صغّر اللوحة"><span></span></button>

  <header class="brand">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 28V15" /><path d="M16 17c0-5 3.6-8.5 9-8.5 0 5.2-3.7 8.5-9 8.5Z" /><path d="M16 20c0-4.2-3-7-7.4-7 0 4.3 3 7 7.4 7Z" /></svg>
    <div>
      <h1 lang="en">GreenSite</h1>
      <p>خريطة أولويات التشجير</p>
    </div>
  </header>

  <!-- View 1: governorates -->
  <section class="view" id="view-iraq" aria-labelledby="gov-h">
    <h2 id="gov-h" class="view-title">اختار محافظة</h2>
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
      <span class="sr">ابحث عن محافظة</span>
      <input id="q" type="search" placeholder="ابحث عن محافظة" autocomplete="off" spellcheck="false">
    </label>
    <ul class="govs" id="govs" role="listbox" aria-labelledby="gov-h"></ul>
    <p class="empty" id="govs-empty" hidden>ماكو محافظة بهالاسم. جرّب تكتبها بشكل ثاني.</p>
  </section>

  <!-- View 2: Baghdad -->
  <section class="view" id="view-city" hidden aria-labelledby="city-h">
    <button class="back" id="back" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      كل المحافظات
    </button>
    <h2 id="city-h" class="city-title">بغداد</h2>
    <p class="city-sub"><span id="c-cells">6,011</span> خلية، كل وحدة تقريباً كيلومتر. بيانات حتى مايو 2026.</p>

    <div class="field">
      <span class="field-l" id="mode-l">لوّن الخلايا حسب</span>
      <div class="seg" role="radiogroup" aria-labelledby="mode-l">
        <button type="button" role="radio" aria-checked="true" data-mode="priority">الأولوية</button>
        <button type="button" role="radio" aria-checked="false" data-mode="cluster">K-Means</button>
        <button type="button" role="radio" aria-checked="false" data-mode="soil">التربة</button>
      </div>
      <div class="legend" id="legend"></div>
    </div>

    <div class="field">
      <label class="field-l" for="dist">أفضل 20 منطقة، تبعد عن المركز <output id="dist-out" for="dist">0 كم</output> أو أكثر</label>
      <input type="range" id="dist" min="0" max="50" step="1" value="0">
    </div>

    <ol class="sites" id="sites"></ol>
  </section>

  <footer class="panel-foot">
    <span lang="en">Team SiTouch, Green Code Hackathon</span>
  </footer>
</aside>

<div class="hud" id="hud">
  <button type="button" class="chip" id="toggle-3d" aria-pressed="true" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 7.5v9L12 21l8-4.5v-9L12 3Z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9"/></svg>
    <span>3D</span>
  </button>
  <button type="button" class="chip" id="reset-view" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v4M12 16v4M4 12h4M16 12h4"/><circle cx="12" cy="12" r="3"/></svg>
    <span>رجّع الكاميرا</span>
  </button>
</div>

<article class="card" id="card" hidden aria-live="polite"></article>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="intro" id="intro" aria-hidden="true">
  <div class="intro-glow"></div>
  <p lang="en"><span style="--i:0">G</span><span style="--i:1">r</span><span style="--i:2">e</span><span style="--i:3">e</span><span style="--i:4">n</span><span style="--i:5">S</span><span style="--i:6">i</span><span style="--i:7">t</span><span style="--i:8">e</span></p>
  <small>خريطة أولويات التشجير</small>
</div>

<script src="assets/vendor/maplibre/maplibre-gl.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
